<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta
			name="theme-color"
			content="#111013"
			media="(prefers-color-scheme: dark)"
		/>
		<meta
			name="theme-color"
			content="#fbfaf9"
			media="(prefers-color-scheme: light)"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ledger</title>
		<meta
			name="description"
			content="Ledger is a private personal finance app: bank accounts, subscriptions, goals, budgets and invoices in one place."
		/>
		<!-- %THEME_BOOT% -->
		<style>
			/* The same scrollbar space the app stylesheet reserves, so the centred loader doesn't shift sideways when it arrives. */
			html {
				overflow-y: scroll;
				scrollbar-gutter: stable;
				scrollbar-width: thin;
			}
			/*
       * The full-page loader (src/components/layout/app-loader.tsx). It lives here so it styles the copy in
       * #root below, which shows until the app's code has loaded. Every animation is a fraction of one
       * 3.2s loop and starts at --loader-phase, so the app's own copy picks up where this one is.
       */
			.app-loader {
				--loader-phase: 0ms;
				position: fixed;
				inset: 0;
				/* Above the app's header: on first load the loader covers the whole window until the page is ready. */
				z-index: 50;
				display: grid;
				place-items: center;
				pointer-events: none;
				/* The app's page colour (bg-muted/40 over the background). Before the stylesheet loads the
           variables don't exist, this is invalid, and the theme colour index.html set shows instead. */
				background: color-mix(
					in oklab,
					var(--muted) 40%,
					var(--background)
				);
			}
			/* Inside the app the header stays on top of it. */
			.app-loader-in-page {
				z-index: 20;
			}
			.app-loader-delayed {
				animation: app-loader-in 300ms ease-out both;
			}
			.app-loader-mark {
				position: relative;
				display: grid;
				place-items: center;
				width: 56px;
				height: 56px;
				border-radius: 16px;
				/* The same tile as the app's logo (bg-sunset). The accent colour only exists once the stylesheet
           has loaded; until then there is deliberately no fallback, so the tile and icon stay unpainted
           instead of flashing the wrong colour. */
				background: linear-gradient(
					135deg,
					color-mix(in oklab, var(--primary) 88%, white) 0%,
					var(--primary) 100%
				);
				animation: app-loader-float 3200ms ease-in-out
					var(--loader-phase) infinite;
			}
			.app-loader-mark svg {
				width: 30px;
				height: 30px;
				overflow: visible;
				fill: none;
				stroke: var(--primary-foreground, transparent);
				stroke-width: 2.25;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			/* The columns draw upward one after another, hold, then clear for the next loop. */
			.app-loader-col {
				stroke-dasharray: 7 8;
				animation: app-loader-col 1600ms cubic-bezier(0.65, 0, 0.35, 1)
					infinite;
			}
			.app-loader-col:nth-of-type(2) {
				animation-delay: var(--loader-phase);
			}
			.app-loader-col:nth-of-type(3) {
				animation-delay: calc(var(--loader-phase) + 90ms);
			}
			.app-loader-col:nth-of-type(4) {
				animation-delay: calc(var(--loader-phase) + 180ms);
			}
			.app-loader-col:nth-of-type(5) {
				animation-delay: calc(var(--loader-phase) + 270ms);
			}
			.app-loader-roof {
				animation: app-loader-roof 1600ms cubic-bezier(0.65, 0, 0.35, 1)
					var(--loader-phase) infinite;
			}
			.app-loader-base {
				opacity: 0.9;
			}
			/* The name and message sit below the mark, out of the grid flow so the mark never moves. */
			.app-loader-text {
				position: absolute;
				top: calc(50% + 28px + 16px);
				left: 0;
				right: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
				padding: 0 24px;
				text-align: center;
				font-family: system-ui, sans-serif;
				/* Same as the app stylesheet's, so the text doesn't resize when that arrives. */
				line-height: 1.5;
			}
			.app-loader-name {
				font-size: 18px;
				font-weight: 600;
				letter-spacing: -0.01em;
				color: var(--foreground);
			}
			.app-loader-message {
				min-height: 1.25em;
				font-size: 14px;
				color: var(--muted-foreground, color-mix(in srgb, currentColor 60%, transparent));
			}
			.app-loader-message-swap {
				animation: app-loader-in 400ms ease-out both;
			}
			@keyframes app-loader-in {
				from {
					opacity: 0;
				}
			}
			@keyframes app-loader-float {
				50% {
					transform: translateY(-3px);
				}
			}
			@keyframes app-loader-col {
				0% {
					stroke-dashoffset: 7;
				}
				35%,
				75% {
					stroke-dashoffset: 0;
				}
				100% {
					stroke-dashoffset: -7;
				}
			}
			@keyframes app-loader-roof {
				0% {
					transform: translateY(-4px);
					opacity: 0;
				}
				30%,
				80% {
					transform: none;
					opacity: 1;
				}
				100% {
					transform: translateY(-2px);
					opacity: 0;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.app-loader *,
				.app-loader *::before {
					animation: none !important;
				}
			}
		</style>
	</head>
	<body>
		<div id="root">
			<!-- Shown until the app loads; React swaps in the same loader (src/components/layout/app-loader.tsx). -->
			<div class="app-loader" role="status" aria-label="Loading">
				<div class="app-loader-mark">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							class="app-loader-roof"
							d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"
						/>
						<path class="app-loader-col" d="M6 18v-7" />
						<path class="app-loader-col" d="M10 18v-7" />
						<path class="app-loader-col" d="M14 18v-7" />
						<path class="app-loader-col" d="M18 18v-7" />
						<path class="app-loader-base" d="M3 22h18" />
					</svg>
				</div>
				<div class="app-loader-text">
					<span class="app-loader-name">Ledger</span>
				</div>
			</div>
		</div>
		<script src="/loader-messages.js"></script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
